# Keeps GitHub Actions versions and the WinUI frontend's NuGet packages
# fresh; zero runner cost, weekly cadence.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /frontend/windows/ewcalc-winui/ewcalc-winui
    schedule:
      interval: weekly
