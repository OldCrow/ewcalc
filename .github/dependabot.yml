# Keeps GitHub Actions versions fresh; zero runner cost, weekly cadence.
#
# No nuget entry for the WinUI frontend (frontend/windows/ewcalc-winui/):
# Dependabot's NuGet updater does `dotnet restore` on ewcalc-winui.csproj
# in a Linux container, which fails resolving the C++/CLI adapter project
# (ewpresenter.net) -- it needs $(VCTargetsPath)/Microsoft.Cpp.Default.props,
# only present with a real Visual Studio C++ toolchain. Confirmed via an
# actual failed Dependabot run (dependency_file_not_found). Matches the
# same "can't resolve ewpresenter.net's C++/CLI types outside a full
# solution build context" constraint AGENTS.md documents for dotnet format.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # codeql-action's sub-actions (init, analyze, ...) MUST run on the same
    # version -- a mismatched pair fails with "Loaded a configuration file for
    # version X, but running version Y". Dependabot otherwise opens a separate
    # PR per sub-action, and each is individually un-mergeable. Grouping keeps
    # them in one PR that bumps the whole set together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
