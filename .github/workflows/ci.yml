name: CI

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]          # trigger packaging on version tags
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [ main ]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:             # allow manual runs to test secrets / packaging
  # Monthly canary: catches drift with no code change to trigger it (runner
  # image rolls, Qt/WinAppSDK NuGet updates). Packaging/signing steps stay
  # skipped (gated on tag refs), so this only re-validates build+test.
  schedule:
    - cron: '55 3 1 * *'

# Restrict GITHUB_TOKEN to read-only by default; the release job overrides to write.
permissions:
  contents: read

# Cancel in-progress runs on the same branch/PR when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Windows ─────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (WinUI 3)
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
      # Windows App SDK runtime is only needed to RUN the app, not to build it.
      # The NuGet packages (Microsoft.WindowsAppSDK etc.) are restored by
      # MSBuild /restore and supply all build-time headers and libs.

      - name: Build (native libs + frontend)
        if: "!(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')"
        shell: pwsh
        run: scripts\build-windows.ps1 -Config Release

      # Package as MSIX on tagged/manual runs so the unsigned .msix is available
      # as a release artifact (see frontend/windows/ewcalc-winui/README.md for
      # signing instructions — CI packaging is intentionally unsigned).
      - name: Build and package (release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: scripts\build-windows.ps1 -Config Release -Package

      # C# style/analyzer gate for the WinUI frontend (see .editorconfig and
      # ewcalc-winui.csproj's EnableNETAnalyzers/AnalysisLevel — issue #44).
      # Scoped to `dotnet format style` only, targeting the .sln with
      # --no-restore right after the build above:
      #   - `style` (IDE code-style analyzers) is what's reliable here; the
      #     `analyzers` subcommand and standalone-csproj invocation cannot
      #     resolve the C++/CLI ewpresenter.net project reference's types
      #     outside a full solution build context and fail with spurious
      #     CS0246 errors.
      #   - Bare `dotnet format` / `dotnet format whitespace` are never run:
      #     the codebase uses deliberate multi-space vertical alignment (see
      #     .editorconfig) that the raw whitespace formatter would collapse.
      #   - Roslyn analyzer diagnostics (CA rules) are already gated by the
      #     build step above, not by dotnet format.
      - name: C# style check (dotnet format)
        shell: pwsh
        run: dotnet format style frontend\windows\ewcalc-winui\ewcalc-winui.sln --no-restore --verify-no-changes

      - name: Run tests
        shell: pwsh
        run: |
          cmake -B build -DEWCALC_BUILD_TESTS=ON
          cmake --build build --config Release
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Attest MSIX provenance
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: build/msix/*.msix

      - name: Upload MSIX
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ewcalc-windows-msix
          path: build/msix/*.msix
          retention-days: 90

  # ── macOS ───────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (SwiftUI) — Phase 4
    runs-on: macos-14           # Apple Silicon runner
    timeout-minutes: 40         # notarization (tag/dispatch runs) can be slow
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CMake
        run: brew install cmake

      # Import the cert and notarytool credentials BEFORE the build so the
      # frontend is compiled and signed with the real Developer ID identity
      # (including --timestamp) in a single build pass.
      - name: Import signing certificate
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          MACOS_CERTIFICATE:     ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID:              ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:         ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PWD: ${{ secrets.APPLE_APP_SPECIFIC_PWD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ewcalc-signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -P "$MACOS_CERTIFICATE_PWD" \
              -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          # shellcheck disable=SC2046  # intentional word-splitting: each existing keychain must be a separate arg
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm /tmp/cert.p12
          xcrun notarytool store-credentials ewcalc-notarytool \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PWD"

      - name: Build, sign, notarize and package (release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: bash scripts/build-macos.sh --config Release --package

      - name: Build (CI)
        if: "!(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')"
        run: bash scripts/build-macos.sh --config Release

      - name: Run tests
        run: |
          cmake -B build -DEWCALC_BUILD_TESTS=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Attest DMG provenance
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: build/pkg/*.dmg

      - name: Upload DMG
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ewcalc-macos-dmg
          path: build/pkg/*.dmg
          retention-days: 90

  # ── Linux ───────────────────────────────────────────────────────────────────
  # Pinned to an older LTS than the other jobs (which use ubuntu-24.04) so the
  # AppImage's bundled libraries (libstdc++, libgcc_s, and whatever Qt/X11
  # transitively pulls in, e.g. libgcrypt) are linked against an older
  # glibc/GLIBCXX baseline. AppImages only ever need to run on systems with a
  # glibc *at least as new* as the build system's, so building on the oldest
  # practical base maximizes compatibility with users' (possibly older)
  # distros. ubuntu-24.04's glibc 2.39/GCC 13 was too new: reported failures
  # for both GLIBCXX_3.4.31 (from libstdc++) and GLIBC_2.38 (from a bundled
  # libgcrypt.so.20) on older user systems. 22.04 is the oldest Ubuntu LTS
  # with qt6-base-dev available via apt.
  build-linux:
    name: Linux (Qt6) — Phase 5
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            qt6-base-dev libgl-dev libopengl0

      - name: Build (native libs + frontend)
        run: bash scripts/build-linux.sh --config Release

      - name: Run tests
        run: |
          cmake -B build -DEWCALC_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Package AppImage
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          # Install linuxdeploy + Qt plugin (both required for Qt AppImages)
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy
          mv linuxdeploy-plugin-qt-x86_64.AppImage /usr/local/bin/linuxdeploy-plugin-qt
          bash scripts/build-linux.sh --config Release --package appimage

      - name: Attest AppImage provenance
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: build/pkg/*.AppImage

      - name: Upload AppImage
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ewcalc-linux-appimage
          path: build/pkg/*.AppImage
          retention-days: 90

      # dpkg-deb is preinstalled on ubuntu runners. The content check is a
      # regression guard for the desktop entry / hicolor icon install rules
      # in frontend/linux/CMakeLists.txt (see CHANGELOG "Linux showed a
      # generic gears icon…").
      - name: Package .deb (sanity check)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          bash scripts/build-linux.sh --config Release --package deb
          DEB="$(ls build/pkg/*.deb)"
          echo "Built: $DEB"
          dpkg-deb --contents "$DEB"
          dpkg-deb --contents "$DEB" | grep -q 'usr/share/applications/ewcalc\.desktop'
          dpkg-deb --contents "$DEB" | grep -q 'usr/share/icons/hicolor/256x256/apps/ewcalc\.png'
          dpkg-deb --contents "$DEB" | grep -q 'usr/bin/ewcalc'

      - name: Attest .deb provenance
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: build/pkg/*.deb

      - name: Upload .deb
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ewcalc-linux-deb
          path: build/pkg/*.deb
          retention-days: 90

  # ── Sanitizers (ASan/UBSan) ────────────────────────────────────────────────
  sanitizers:
    name: Sanitizers (ASan/UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure (ASan + UBSan)
        run: |
          cmake -B build -G Ninja \
            -DEWCALC_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  # ── Static analysis (clang-tidy + cppcheck) ─────────────────────────────────────────
  static-analysis:
    name: Static analysis (clang-tidy + cppcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy cppcheck

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -B build -G Ninja \
            -DEWCALC_BUILD_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # .clang-tidy (repo root) sets WarningsAsErrors, so clang-tidy exits
      # non-zero on any enabled-check violation in libew/ewpresenter sources.
      - name: Run clang-tidy
        run: |
          find libew/src ewpresenter/src -name '*.cpp' -print0 \
            | xargs -0 clang-tidy -p build

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --std=c++20 --language=c++ --inline-suppr --error-exitcode=1 \
            -I libew/include -I ewpresenter/include \
            libew/src ewpresenter/src

  # ── API documentation (Doxygen) ─────────────────────────────────────────
  docs:
    name: API docs (Doxygen)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Generate docs
        run: doxygen Doxyfile

      - name: Upload docs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ewcalc-api-docs
          path: docs/html/
          retention-days: 30

  # ── Code coverage ────────────────────────────────────────────────────────
  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Initial baseline: measured ~79.5% line coverage for libew+ewpresenter
      # (Clang/llvm-cov, macOS validation build). Set a few points below the
      # measured value so the gate gives real regression protection without
      # failing on day one; raise it as coverage improves.
      COVERAGE_THRESHOLD: "75"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang llvm

      - name: Configure (coverage instrumentation)
        run: |
          cmake -B build -G Ninja \
            -DEWCALC_BUILD_TESTS=ON \
            -DEWCALC_BUILD_COVERAGE=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests under instrumentation
        run: |
          mkdir -p build/profraw
          LLVM_PROFILE_FILE="$(pwd)/build/profraw/%p.profraw" \
            ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          llvm-profdata merge -sparse build/profraw/*.profraw -o build/merged.profdata

          BINARIES=()
          while IFS= read -r -d '' f; do
            BINARIES+=("$f")
          done < <(find build/bin -maxdepth 2 -type f -perm -u+x -not -path '*/CMakeFiles/*' -print0)
          OBJECT_ARGS=()
          for bin in "${BINARIES[@]:1}"; do
            OBJECT_ARGS+=(-object "$bin")
          done

          llvm-cov report "${BINARIES[0]}" "${OBJECT_ARGS[@]}" \
            -instr-profile=build/merged.profdata \
            -ignore-filename-regex='(/tests/|/harness/|frontend/)'

          llvm-cov show "${BINARIES[0]}" "${OBJECT_ARGS[@]}" \
            -instr-profile=build/merged.profdata \
            -ignore-filename-regex='(/tests/|/harness/|frontend/)' \
            -format=html -output-dir=coverage-html

          llvm-cov export "${BINARIES[0]}" "${OBJECT_ARGS[@]}" \
            -instr-profile=build/merged.profdata \
            -ignore-filename-regex='(/tests/|/harness/|frontend/)' \
            -summary-only > coverage-summary.json

      - name: Enforce coverage threshold
        run: |
          python3 - <<'EOF'
          import json, os, sys
          threshold = float(os.environ["COVERAGE_THRESHOLD"])
          with open("coverage-summary.json") as f:
              data = json.load(f)
          pct = data["data"][0]["totals"]["lines"]["percent"]
          print(f"Line coverage: {pct:.2f}% (threshold: {threshold:.2f}%)")
          if pct < threshold:
              print("::error::Line coverage dropped below threshold")
              sys.exit(1)
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ewcalc-coverage-html
          path: coverage-html/
          retention-days: 30

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [ build-windows, build-macos, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ewcalc ${{ github.ref_name }}
          draft: true             # review before publishing
          generate_release_notes: true
          files: |
            artifacts/**/*.msix
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
