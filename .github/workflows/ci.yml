name: CI

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]          # trigger packaging on version tags
  pull_request:
    branches: [ main ]
  workflow_dispatch:             # allow manual runs to test secrets / packaging

# Restrict GITHUB_TOKEN to read-only by default; the release job overrides to write.
permissions:
  contents: read

# Cancel in-progress runs on the same branch/PR when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Windows ─────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (WinUI 3)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Windows App SDK runtime is only needed to RUN the app, not to build it.
      # The NuGet packages (Microsoft.WindowsAppSDK etc.) are restored by
      # MSBuild /restore and supply all build-time headers and libs.

      - name: Build (native libs + frontend)
        if: "!(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')"
        shell: pwsh
        run: scripts\build-windows.ps1 -Config Release

      # Package as MSIX on tagged/manual runs so the unsigned .msix is available
      # as a release artifact (see frontend/windows/ewcalc-winui/README.md for
      # signing instructions — CI packaging is intentionally unsigned).
      - name: Build and package (release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: scripts\build-windows.ps1 -Config Release -Package

      - name: Run tests
        shell: pwsh
        run: |
          cmake -B build -DEWCALC_BUILD_TESTS=ON
          cmake --build build --config Release
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Upload MSIX
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ewcalc-windows-msix
          path: build/msix/*.msix
          retention-days: 90

  # ── macOS ───────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (SwiftUI) — Phase 4
    runs-on: macos-14           # Apple Silicon runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        run: brew install cmake

      # Import the cert and notarytool credentials BEFORE the build so the
      # frontend is compiled and signed with the real Developer ID identity
      # (including --timestamp) in a single build pass.
      - name: Import signing certificate
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          MACOS_CERTIFICATE:     ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID:              ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:         ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PWD: ${{ secrets.APPLE_APP_SPECIFIC_PWD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/ewcalc-signing.keychain-db
          security create-keychain -p "" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "" $KEYCHAIN
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -P "$MACOS_CERTIFICATE_PWD" \
              -A -t cert -f pkcs12 -k $KEYCHAIN
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN
          security list-keychain -d user -s $KEYCHAIN $(security list-keychains -d user | tr -d '"')
          rm /tmp/cert.p12
          xcrun notarytool store-credentials ewcalc-notarytool \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PWD"

      - name: Build, sign, notarize and package (release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: bash scripts/build-macos.sh --config Release --package

      - name: Build (CI)
        if: "!(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')"
        run: bash scripts/build-macos.sh --config Release

      - name: Run tests
        run: |
          cmake -B build -DEWCALC_BUILD_TESTS=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Upload DMG
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ewcalc-macos-dmg
          path: build/pkg/*.dmg
          retention-days: 90

  # ── Linux ───────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (Qt6) — Phase 5
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            qt6-base-dev libgl-dev libopengl0

      - name: Build (native libs + frontend)
        run: bash scripts/build-linux.sh --config Release

      - name: Run tests
        run: |
          cmake -B build -DEWCALC_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Package AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Install linuxdeploy + Qt plugin (both required for Qt AppImages)
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy
          mv linuxdeploy-plugin-qt-x86_64.AppImage /usr/local/bin/linuxdeploy-plugin-qt
          bash scripts/build-linux.sh --config Release --package appimage

      - name: Upload AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ewcalc-linux-appimage
          path: build/pkg/*.AppImage
          retention-days: 90

  # ── Sanitizers (ASan/UBSan) ────────────────────────────────────────────────
  sanitizers:
    name: Sanitizers (ASan/UBSan)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure (ASan + UBSan)
        run: |
          cmake -B build -G Ninja \
            -DEWCALC_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  # ── Static analysis (clang-tidy + cppcheck) ─────────────────────────────────────────
  static-analysis:
    name: Static analysis (clang-tidy + cppcheck)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy cppcheck

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -B build -G Ninja \
            -DEWCALC_BUILD_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # .clang-tidy (repo root) sets WarningsAsErrors, so clang-tidy exits
      # non-zero on any enabled-check violation in libew/ewpresenter sources.
      - name: Run clang-tidy
        run: |
          find libew/src ewpresenter/src -name '*.cpp' -print0 \
            | xargs -0 clang-tidy -p build

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --std=c++20 --language=c++ --inline-suppr --error-exitcode=1 \
            -I libew/include -I ewpresenter/include \
            libew/src ewpresenter/src

  # ── API documentation (Doxygen) ─────────────────────────────────────────
  docs:
    name: API docs (Doxygen)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Generate docs
        run: doxygen Doxyfile

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: ewcalc-api-docs
          path: docs/html/
          retention-days: 30

  # ── Code coverage ────────────────────────────────────────────────────────
  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    env:
      # Initial baseline: measured ~79.5% line coverage for libew+ewpresenter
      # (Clang/llvm-cov, macOS validation build). Set a few points below the
      # measured value so the gate gives real regression protection without
      # failing on day one; raise it as coverage improves.
      COVERAGE_THRESHOLD: "75"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang llvm

      - name: Configure (coverage instrumentation)
        run: |
          cmake -B build -G Ninja \
            -DEWCALC_BUILD_TESTS=ON \
            -DEWCALC_BUILD_COVERAGE=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests under instrumentation
        run: |
          mkdir -p build/profraw
          LLVM_PROFILE_FILE="$(pwd)/build/profraw/%p.profraw" \
            ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          llvm-profdata merge -sparse build/profraw/*.profraw -o build/merged.profdata

          BINARIES=()
          while IFS= read -r -d '' f; do
            BINARIES+=("$f")
          done < <(find build/bin -maxdepth 2 -type f -perm -u+x -not -path '*/CMakeFiles/*' -print0)
          OBJECT_ARGS=()
          for bin in "${BINARIES[@]:1}"; do
            OBJECT_ARGS+=(-object "$bin")
          done

          llvm-cov report "${BINARIES[0]}" "${OBJECT_ARGS[@]}" \
            -instr-profile=build/merged.profdata \
            -ignore-filename-regex='(/tests/|/harness/|frontend/)'

          llvm-cov show "${BINARIES[0]}" "${OBJECT_ARGS[@]}" \
            -instr-profile=build/merged.profdata \
            -ignore-filename-regex='(/tests/|/harness/|frontend/)' \
            -format=html -output-dir=coverage-html

          llvm-cov export "${BINARIES[0]}" "${OBJECT_ARGS[@]}" \
            -instr-profile=build/merged.profdata \
            -ignore-filename-regex='(/tests/|/harness/|frontend/)' \
            -summary-only > coverage-summary.json

      - name: Enforce coverage threshold
        run: |
          python3 - <<'EOF'
          import json, os, sys
          threshold = float(os.environ["COVERAGE_THRESHOLD"])
          with open("coverage-summary.json") as f:
              data = json.load(f)
          pct = data["data"][0]["totals"]["lines"]["percent"]
          print(f"Line coverage: {pct:.2f}% (threshold: {threshold:.2f}%)")
          if pct < threshold:
              print("::error::Line coverage dropped below threshold")
              sys.exit(1)
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ewcalc-coverage-html
          path: coverage-html/
          retention-days: 30

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [ build-windows, build-macos, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ewcalc ${{ github.ref_name }}
          draft: true             # review before publishing
          generate_release_notes: true
          files: |
            artifacts/**/*.msix
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
