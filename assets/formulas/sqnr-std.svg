<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 30" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Signal-to-quantization-noise ratio, standard form:
       SQNR = 6.02 N + 1.76  dB.
       SQNR upright, N italic.
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="20">SQNR = 6.02 <tspan font-style="italic">N</tspan> + 1.76  <tspan font-size="10">dB</tspan></text>
  </g>
</svg>
