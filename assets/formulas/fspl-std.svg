<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 48" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Free-space path loss, standard form: FSPL = (4·pi·d·f / c)^2 —
       frequency notation, consistent with the log form's f(MHz).
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer
       (ewpresenter/src/reference_data.cpp), not here.
       NOTE: all formula masters use font-size 15 so glyphs match in size
       across formulas when frontends show the 2x PNGs at half pixel size. -->
  <g fill="#808080">
    <!-- Left side: function name upright, '=' -->
    <text x="8" y="29">FSPL</text>
    <text x="50" y="29">=</text>

    <!-- Opening/closing parentheses sized to span the fraction -->
    <text x="65" y="33" font-size="33">(</text>
    <text x="116" y="33" font-size="33">)</text>

    <!-- Fraction: 4πdf over c -->
    <text x="78" y="21">4<tspan font-style="italic">&#960;df</tspan></text>
    <text x="92" y="44" font-style="italic">c</text>

    <!-- Exponent -->
    <text x="128" y="17" font-size="11">2</text>
  </g>
  <!-- Fraction bar -->
  <line x1="77" y1="25.5" x2="113" y2="25.5" stroke="#808080" stroke-width="1.2"/>
</svg>
