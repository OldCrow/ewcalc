<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 48" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Free-space path loss, standard form: FSPL = (4·pi·d / lambda)^2.
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer
       (ewpresenter/src/reference_data.cpp), not here.
       NOTE: all formula masters use font-size 15 so glyphs match in size
       across formulas when frontends show the 2x PNGs at half pixel size. -->
  <g fill="#808080">
    <!-- Left side: function name upright, '=' -->
    <text x="8" y="29">FSPL</text>
    <text x="50" y="29">=</text>

    <!-- Opening/closing parentheses sized to span the fraction -->
    <text x="65" y="33" font-size="33">(</text>
    <text x="131" y="33" font-size="33">)</text>

    <!-- Fraction: 4πd over λ -->
    <text x="82" y="21">4<tspan font-style="italic">&#960;d</tspan></text>
    <text x="100" y="44" font-style="italic">&#955;</text>

    <!-- Exponent -->
    <text x="143" y="17" font-size="11">2</text>
  </g>
  <!-- Fraction bar -->
  <line x1="78" y1="25.5" x2="129" y2="25.5" stroke="#808080" stroke-width="1.2"/>
</svg>
