<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 48" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Friis transmission equation, standard form:
       P_r = P_t G_t G_r (lambda / 4 pi d)^2.
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 so glyphs match in size
       across formulas when frontends show the 2x PNGs at half pixel size. -->
  <g fill="#808080">
    <text x="8" y="29"><tspan font-style="italic">P</tspan><tspan font-size="10" dy="3" font-style="normal">r</tspan><tspan dy="-3" font-style="normal">&#8203;</tspan></text>
    <text x="34" y="29">=</text>
    <text x="50" y="29"><tspan font-style="italic">P</tspan><tspan font-size="10" dy="3" font-style="normal">t</tspan><tspan dy="-3" font-style="normal">&#8203;</tspan></text>
    <text x="76" y="29"><tspan font-style="italic">G</tspan><tspan font-size="10" dy="3" font-style="normal">t</tspan><tspan dy="-3" font-style="normal">&#8203;</tspan></text>
    <text x="102" y="29"><tspan font-style="italic">G</tspan><tspan font-size="10" dy="3" font-style="normal">r</tspan><tspan dy="-3" font-style="normal">&#8203;</tspan></text>

    <!-- Parenthesized fraction: lambda over 4 pi d -->
    <text x="132" y="33" font-size="33">(</text>
    <text x="160" y="21" text-anchor="middle" font-style="italic">&#955;</text>
    <text x="160" y="44" text-anchor="middle">4<tspan font-style="italic">&#960;d</tspan></text>
    <text x="183" y="33" font-size="33">)</text>

    <!-- Exponent -->
    <text x="196" y="17" font-size="11">2</text>
  </g>
  <!-- Fraction bar -->
  <line x1="140" y1="25.5" x2="180" y2="25.5" stroke="#808080" stroke-width="1.2"/>
</svg>
