<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 30" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Receiver sensitivity, log form:
       S = -114 + 10 log10 B(MHz) + NF + SNR_r   dBm.
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="20"><tspan font-style="italic">S</tspan> = &#8722;114 + 10 log<tspan font-size="10" dy="4">10</tspan><tspan dy="-4">&#8203;</tspan> <tspan font-style="italic">B</tspan><tspan font-size="10">(MHz)</tspan> + NF + SNR<tspan font-size="10" dy="4">r</tspan><tspan dy="-4">&#8203;</tspan>  <tspan font-size="10">dBm</tspan></text>
  </g>
</svg>
