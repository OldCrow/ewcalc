<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 30" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Second-order spurious-free dynamic range, standard form:
       SFDR2 = (IIP2 - S) / 2.
       SFDR/IIP upright with subscript digits, S italic; solidus form.
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="20">SFDR<tspan font-size="10" dy="4">2</tspan><tspan dy="-4">&#8203;</tspan> = (IIP<tspan font-size="10" dy="4">2</tspan><tspan dy="-4">&#8203;</tspan> &#8722; <tspan font-style="italic">S</tspan>) / 2</text>
  </g>
</svg>
