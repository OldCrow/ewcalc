<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 204 32" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Radio-horizon distance, standard form:
       R = sqrt(2*k*R_e) * (sqrt(h_t) + sqrt(h_r)).
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="22" font-style="italic">R</text>
    <text x="24" y="22">=</text>

    <!-- First radical: sqrt(2 k R_e) -->
    <text x="42" y="22">&#8730;</text>
    <text x="54" y="20">(2<tspan font-style="italic">kR</tspan><tspan font-size="10" dy="4">e</tspan><tspan dy="-4">&#8203;</tspan>)</text>

    <!-- Second group: (sqrt(h_t) + sqrt(h_r)) -->
    <text x="102" y="22">(</text>
    <text x="110" y="22">&#8730;</text>
    <text x="122" y="20"><tspan font-style="italic">h</tspan><tspan font-size="10" dy="4">t</tspan><tspan dy="-4">&#8203;</tspan></text>
    <text x="145" y="22">+</text>
    <text x="161" y="22">&#8730;</text>
    <text x="173" y="20"><tspan font-style="italic">h</tspan><tspan font-size="10" dy="4">r</tspan><tspan dy="-4">&#8203;</tspan></text>
    <text x="194" y="22">)</text>
  </g>
  <!-- Radical overlines -->
  <line x1="54" y1="7" x2="97" y2="7" stroke="#808080" stroke-width="1"/>
  <line x1="122" y1="7" x2="140" y2="7" stroke="#808080" stroke-width="1"/>
  <line x1="173" y1="7" x2="191" y2="7" stroke="#808080" stroke-width="1"/>
</svg>
