<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 95 48" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Two-ray ground-reflection loss, standard form: L = d^4 / (h_t^2 h_r^2).
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <!-- Left side -->
    <text x="8" y="29" font-style="italic">L</text>
    <text x="24" y="29">=</text>

    <!-- Fraction: d^4 over h_t^2 h_r^2 -->
    <text x="60" y="21" text-anchor="middle" font-style="italic">d<tspan font-size="10" dy="-6">4</tspan><tspan dy="6">&#8203;</tspan></text>
    <text x="60" y="44" text-anchor="middle"><tspan font-style="italic">h</tspan><tspan font-size="10" dy="4">t</tspan><tspan dy="-4">&#8203;</tspan><tspan font-size="10" dy="-6">2</tspan><tspan dy="6">&#8203;</tspan> <tspan font-style="italic">h</tspan><tspan font-size="10" dy="4">r</tspan><tspan dy="-4">&#8203;</tspan><tspan font-size="10" dy="-6">2</tspan><tspan dy="6">&#8203;</tspan></text>
  </g>
  <!-- Fraction bar -->
  <line x1="38" y1="25.5" x2="82" y2="25.5" stroke="#808080" stroke-width="1.2"/>
</svg>
