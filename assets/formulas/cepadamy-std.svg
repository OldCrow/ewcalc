<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 163 30" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- CEP from DAMY-combined error semi-axes, standard (and only) form:
       CEP ~= 0.75 sqrt(a^2 + b^2).
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="20">CEP &#8776; 0.75</text>
    <text x="86" y="20">&#8730;</text>
    <text x="98" y="18">(<tspan font-style="italic">a</tspan><tspan font-size="11" dy="-5">2</tspan><tspan dy="5">&#8203;</tspan> + <tspan font-style="italic">b</tspan><tspan font-size="11" dy="-5">2</tspan><tspan dy="5">&#8203;</tspan>)</text>
  </g>
  <!-- Radical overline -->
  <line x1="98" y1="5" x2="151" y2="5" stroke="#808080" stroke-width="1"/>
</svg>
