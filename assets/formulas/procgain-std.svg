<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 30" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Processing gain, standard (and only) form:
       PG = 10 log10 (R_c / R_b).
       PG upright (an abbreviation, not a variable); R italic with
       small upright subscripts c/b (chip-rate / bit-rate labels).
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="20">PG = 10 log<tspan font-size="10" dy="4">10</tspan><tspan dy="-4">&#8203;</tspan> (<tspan font-style="italic">R</tspan><tspan font-size="10" dy="4">c</tspan><tspan dy="-4">&#8203;</tspan>/<tspan font-style="italic">R</tspan><tspan font-size="10" dy="4">b</tspan><tspan dy="-4">&#8203;</tspan>)</text>
  </g>
</svg>
