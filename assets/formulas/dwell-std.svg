<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 30" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Beam dwell time and hit count, standard (and only) form:
       T_D = theta_az / omega;  hits = T_D · PRF.
       Two-clause semicolon line per knife-log's pattern. T italic with
       small upright D subscript; theta italic with small upright az
       subscript (azimuth beamwidth); omega italic; "hits"/"PRF" upright;
       T_D reused upright-numeral-free in the second clause.
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="20"><tspan font-style="italic">T</tspan><tspan font-size="10" dy="4">D</tspan><tspan dy="-4">&#8203;</tspan> = <tspan font-style="italic">&#952;</tspan><tspan font-size="10" dy="4">az</tspan><tspan dy="-4">&#8203;</tspan> / <tspan font-style="italic">&#969;</tspan>;  hits = <tspan font-style="italic">T</tspan><tspan font-size="10" dy="4">D</tspan><tspan dy="-4">&#8203;</tspan> &#183; PRF</text>
  </g>
</svg>
