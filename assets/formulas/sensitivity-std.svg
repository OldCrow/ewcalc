<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 30" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Receiver sensitivity, standard form: S = k T B F . SNR_r.
       All-italic true variables (k, T, B, F); SNR is an abbreviation so it
       stays upright, with an upright subscript r.
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="20"><tspan font-style="italic">S</tspan> = <tspan font-style="italic">kTBF</tspan> &#183; SNR<tspan font-size="10" dy="4">r</tspan><tspan dy="-4">&#8203;</tspan></text>
  </g>
</svg>
