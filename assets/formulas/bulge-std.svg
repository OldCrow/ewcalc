<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 48" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Earth-bulge obstruction height, standard form: h = d1*d2 / (2*k*R_e).
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <!-- Left side -->
    <text x="8" y="29" font-style="italic">h</text>
    <text x="24" y="29">=</text>

    <!-- Fraction: d1*d2 over 2*k*R_e -->
    <text x="98" y="21" text-anchor="middle"><tspan font-style="italic">d</tspan><tspan font-size="10" dy="4">1</tspan><tspan dy="-4">&#8203;</tspan> <tspan font-style="italic">d</tspan><tspan font-size="10" dy="4">2</tspan><tspan dy="-4">&#8203;</tspan></text>
    <text x="98" y="44" text-anchor="middle">2<tspan font-style="italic">kR</tspan><tspan font-size="10" dy="4">e</tspan><tspan dy="-4">&#8203;</tspan></text>
  </g>
  <!-- Fraction bar -->
  <line x1="45" y1="25.5" x2="151" y2="25.5" stroke="#808080" stroke-width="1.2"/>
</svg>
