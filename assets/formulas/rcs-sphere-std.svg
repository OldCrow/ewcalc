<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 30" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Radar cross section of a sphere (optical region), standard form:
       sigma = pi r^2.
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="20"><tspan font-style="italic">&#963;</tspan> = <tspan font-style="italic">&#960;r</tspan><tspan font-size="11" dy="-5">2</tspan><tspan dy="5">&#8203;</tspan></text>
  </g>
</svg>
