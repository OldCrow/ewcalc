<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 30" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Two-ray ground-reflection loss, log form:
       L = 120 + 40 log10 d(km) - 20 log10 h_t(m) - 20 log10 h_r(m)  dB.
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="20"><tspan font-style="italic">L</tspan> = 120 + 40 log<tspan font-size="10" dy="4">10</tspan><tspan dy="-4">&#8203;</tspan> <tspan font-style="italic">d</tspan><tspan font-size="10">(km)</tspan> &#8722; 20 log<tspan font-size="10" dy="4">10</tspan><tspan dy="-4">&#8203;</tspan> <tspan font-style="italic">h</tspan><tspan font-size="10" dy="4">t</tspan><tspan dy="-4">&#8203;</tspan><tspan font-size="10">(m)</tspan> &#8722; 20 log<tspan font-size="10" dy="4">10</tspan><tspan dy="-4">&#8203;</tspan> <tspan font-style="italic">h</tspan><tspan font-size="10" dy="4">r</tspan><tspan dy="-4">&#8203;</tspan><tspan font-size="10">(m)</tspan>  <tspan font-size="10">dB</tspan></text>
  </g>
</svg>
