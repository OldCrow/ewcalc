<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 30" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Equivalent noise temperature, standard form: T_e = (F - 1) * 290 K.
       T italic with small upright e subscript; F italic; "290 K" upright.
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="20"><tspan font-style="italic">T</tspan><tspan font-size="10" dy="4">e</tspan><tspan dy="-4">&#8203;</tspan> = (<tspan font-style="italic">F</tspan> &#8722; 1) &#183; 290 K</text>
  </g>
</svg>
