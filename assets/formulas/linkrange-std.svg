<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 44" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- Link-range distance, standard (and only) form:
       R = 10^((ERP + G_r - S - 32.44 - 20 log10 f(MHz)) / 20)   km.
       The bracketed exponent is set small (font-size 10-11) and inline
       rather than as a nested fraction, for legibility at that scale.
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="30"><tspan font-style="italic">R</tspan> = 10<tspan font-size="11" dy="-10">(ERP + <tspan font-style="italic">G</tspan><tspan font-size="8" dy="3">r</tspan><tspan dy="-3">&#8203;</tspan> &#8722; <tspan font-style="italic">S</tspan> &#8722; 32.44 &#8722; 20 log<tspan font-size="8" dy="3">10</tspan><tspan dy="-3">&#8203;</tspan> <tspan font-style="italic">f</tspan>(MHz)) / 20</tspan><tspan dy="10">&#8203;</tspan>  km</text>
  </g>
</svg>
