<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 239 30" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- LPI processing advantage, standard (and only) form:
       LPI advantage = 10 log10 (T·B) / 4.
       "LPI advantage" upright (a named quantity, not a product of
       variables); T·B italic with a midline dot; trailing solidus
       fraction over 4, per pbduty-std's inline solidus pattern.
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="20">LPI advantage = 10 log<tspan font-size="10" dy="4">10</tspan><tspan dy="-4">&#8203;</tspan> (<tspan font-style="italic">T&#183;B</tspan>) / 4</text>
  </g>
</svg>
