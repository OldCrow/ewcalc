<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 139 30" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- CEP from ellipse error probable semi-axes, standard (and only) form:
       CEP ~= 0.59 (a + b).
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="20">CEP &#8776; 0.59 (<tspan font-style="italic">a</tspan> + <tspan font-style="italic">b</tspan>)</text>
  </g>
</svg>
