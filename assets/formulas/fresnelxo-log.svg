<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 30" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <!-- First-Fresnel-zone crossover distance, log form:
       d_FZ(km) = h_t(m) h_r(m) f(MHz) / 24 000.
       Mid-gray (#808080) like the diagram masters so one asset serves
       light and dark themes. Alt text lives in the data layer.
       NOTE: all formula masters use font-size 15 — see fspl-std.svg. -->
  <g fill="#808080">
    <text x="8" y="20"><tspan font-style="italic">d</tspan><tspan font-size="10" dy="4">FZ</tspan><tspan dy="-4">&#8203;</tspan><tspan font-size="10">(km)</tspan> = <tspan font-style="italic">h</tspan><tspan font-size="10" dy="4">t</tspan><tspan dy="-4">&#8203;</tspan><tspan font-size="10">(m)</tspan> <tspan font-style="italic">h</tspan><tspan font-size="10" dy="4">r</tspan><tspan dy="-4">&#8203;</tspan><tspan font-size="10">(m)</tspan> <tspan font-style="italic">f</tspan><tspan font-size="10">(MHz)</tspan> / 24&#8239;000</text>
  </g>
</svg>
