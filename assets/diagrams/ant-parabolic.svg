<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="system-ui, sans-serif" font-size="14">
  <!-- Parabolic reflector: dish profile with feed at the focus, side view.
       Very narrow pencil beam with small sidelobes; gain scales with
       aperture area, beamwidth ~ lambda/D. -->

  <!-- Dish profile (gray): parabola opening right -->
  <path d="M110 60 Q 190 150, 110 240" fill="none" stroke="#808080" stroke-width="2.5"/>
  <text x="90" y="150" text-anchor="middle" fill="#808080">dish</text>

  <!-- Feed at focus (gray) -->
  <circle cx="175" cy="150" r="5" fill="#808080"/>
  <text x="175" y="132" text-anchor="middle" fill="#808080">feed</text>

  <!-- Boresight -->
  <line x1="110" y1="150" x2="580" y2="150" stroke="#808080" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Radiation pattern (blue): very narrow pencil beam -->
  <path d="M175 150 C 300 138, 470 138, 560 149 C 564 150, 564 150, 560 151 C 470 162, 300 162, 175 150 Z"
        stroke="#3b82c4" stroke-width="2.5" fill="none"/>

  <!-- Small sidelobes (gray) -->
  <g stroke="#808080" stroke-width="1.2" fill="none">
    <path d="M175 150 C 230 132, 280 130, 305 137 C 285 140, 240 145, 175 150"/>
    <path d="M175 150 C 230 168, 280 170, 305 163 C 285 160, 240 155, 175 150"/>
  </g>
  <text x="330" y="124" fill="#808080">sidelobes</text>

  <!-- Beamwidth annotation (amber) -->
  <g stroke="#c49a3b" stroke-width="1.5" fill="none" stroke-dasharray="6 4">
    <line x1="175" y1="150" x2="520" y2="140"/>
    <line x1="175" y1="150" x2="520" y2="160"/>
  </g>
  <text x="500" y="198" text-anchor="middle" fill="#c49a3b">very narrow &#952;<tspan font-size="10" dy="3">3dB</tspan><tspan dy="-3">&#8203;</tspan></text>

  <!-- Takeaway -->
  <text x="320" y="26" text-anchor="middle" fill="#808080">Beamwidth &#8776; 70&#955;/D &#8212; a larger dish trades beamwidth</text>
  <text x="320" y="44" text-anchor="middle" fill="#808080">for gain, degree by degree</text>
</svg>
