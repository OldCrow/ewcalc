<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="system-ui, sans-serif" font-size="14">
  <!-- Phased array: flat panel of small radiating elements, side view.
       Electronic phasing steers the main lobe off boresight without
       moving the panel; a faint second lobe position shows the steer. -->

  <!-- Panel (gray) -->
  <rect x="150" y="90" width="14" height="120" fill="none" stroke="#808080" stroke-width="2.5"/>
  <g stroke="#808080" stroke-width="1.5">
    <line x1="150" y1="110" x2="164" y2="110"/>
    <line x1="150" y1="130" x2="164" y2="130"/>
    <line x1="150" y1="150" x2="164" y2="150"/>
    <line x1="150" y1="170" x2="164" y2="170"/>
    <line x1="150" y1="190" x2="164" y2="190"/>
  </g>
  <text x="157" y="76" text-anchor="middle" fill="#808080">array panel</text>

  <!-- Boresight (normal to panel) -->
  <line x1="164" y1="150" x2="560" y2="150" stroke="#808080" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Faint second lobe position (broadside, unsteered) -->
  <path d="M164 150 C 260 108, 380 108, 460 148 C 464 150, 464 150, 460 152 C 380 192, 260 192, 164 150 Z"
        stroke="#3b82c4" stroke-width="1.5" fill="none" opacity="0.35"/>

  <!-- Steered main lobe (blue), rotated up off boresight -->
  <path d="M164 150 C 250 55, 370 40, 450 78 C 456 81, 456 84, 450 87 C 400 108, 300 115, 164 150 Z"
        stroke="#3b82c4" stroke-width="2.5" fill="none"/>
  <text x="420" y="65" fill="#3b82c4">steered lobe</text>

  <!-- Steering angle arc (amber) -->
  <path d="M 260 137 A 100 100 0 0 1 268 92" stroke="#c49a3b" stroke-width="1.5" fill="none"/>
  <path d="M268 92 l-9 -3 l4 9 Z" fill="#c49a3b"/>
  <text x="230" y="115" fill="#c49a3b">&#952;<tspan font-size="10" dy="3">scan</tspan><tspan dy="-3">&#8203;</tspan></text>

  <!-- Takeaway -->
  <text x="320" y="26" text-anchor="middle" fill="#808080">Element phase, not mechanical motion, steers the beam &#8212;</text>
  <text x="320" y="44" text-anchor="middle" fill="#808080">gain falls off the further the scan moves from boresight</text>
</svg>
