<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="system-ui, sans-serif" font-size="14">
  <!-- Quarter-wave monopole over an infinite ground plane: image theory
       gives it a dipole's upper-half pattern folded above the plane,
       doubling gain relative to a dipole for the same input power. -->

  <!-- Ground plane (gray) -->
  <line x1="60" y1="196" x2="420" y2="196" stroke="#808080" stroke-width="2"/>
  <g stroke="#808080" stroke-width="1.5">
    <line x1="70" y1="196" x2="55" y2="211"/>
    <line x1="100" y1="196" x2="85" y2="211"/>
    <line x1="130" y1="196" x2="115" y2="211"/>
    <line x1="160" y1="196" x2="145" y2="211"/>
    <line x1="190" y1="196" x2="175" y2="211"/>
    <line x1="220" y1="196" x2="205" y2="211"/>
    <line x1="250" y1="196" x2="235" y2="211"/>
    <line x1="280" y1="196" x2="265" y2="211"/>
    <line x1="310" y1="196" x2="295" y2="211"/>
    <line x1="340" y1="196" x2="325" y2="211"/>
    <line x1="370" y1="196" x2="355" y2="211"/>
    <line x1="400" y1="196" x2="385" y2="211"/>
  </g>

  <!-- Element (gray), vertical, quarter-wave above the plane -->
  <line x1="230" y1="196" x2="230" y2="132" stroke="#808080" stroke-width="2.5"/>
  <text x="230" y="117" text-anchor="middle" fill="#808080">&#955;/4</text>

  <!-- Radiation pattern (blue): upper-half figure-eight only -->
  <path d="M230 196 C 355 116, 445 116, 230 196 Z" stroke="#3b82c4" stroke-width="2.5" fill="none"/>
  <path d="M230 196 C 105 116, 15 116, 230 196 Z" stroke="#3b82c4" stroke-width="2.5" fill="none"/>
  <text x="470" y="160" fill="#3b82c4">broadside lobe</text>
  <text x="470" y="178" fill="#3b82c4">(above plane only)</text>

  <!-- Beamwidth annotation (amber) -->
  <g stroke="#c49a3b" stroke-width="1.5" fill="none" stroke-dasharray="6 4">
    <line x1="230" y1="196" x2="380" y2="145"/>
  </g>
  <text x="345" y="140" fill="#c49a3b">low-angle max</text>

  <!-- Takeaway -->
  <text x="320" y="30" text-anchor="middle" fill="#808080">Ground plane images the missing half &#8212; ~3 dB more gain than a dipole for the same power</text>
</svg>
