default_language_version:
  python: python3

# Build output and untracked tool caches never reach the hooks.
exclude: '^(build[^/]*|out|\.cache)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The fixers must leave binary assets, generated or IDE-owned Xcode/XAML
      # designer output, and WinUI/MSBuild build output byte-exact.
      - id: trailing-whitespace
        exclude: &fixer_exclude >-
          (?x)(
            \.(png|ico|icns|pbxproj|xcscheme|xcassets|resx|g\.cs|g\.i\.cs|designer\.cs)$
            | (^|/)Assets\.xcassets/
            | (^|/)(bin|obj)/
          )
      - id: end-of-file-fixer
        exclude: *fixer_exclude
      # Windows-owned types keep CRLF (see .gitattributes); everything else is LF.
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: >-
          (?x)(
            \.(sln|vcxproj|csproj|props|targets|filters|appxmanifest|manifest|resx|ps1|cmd|bat)$
            | \.(png|ico|icns)$
          )
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  # C++ core, presenter, bridge, tests and the Qt frontend. frontend/windows
  # (C++/CLI, generated WinUI code) and frontend/macos are out of scope.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c]
        args: ['--style=file']
        files: '^(libew|ewpresenter|bridge)/|^frontend/linux/'
