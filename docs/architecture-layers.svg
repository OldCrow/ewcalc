<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="478" viewBox="0 0 740 478">
  <title>ewcalc layering</title>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- Frontends -->
    <rect x="12" y="12" width="716" height="134" rx="14"
          fill="#1b4d8f" stroke="#1a1a1a" stroke-width="3"/>
    <text x="370" y="33" font-size="15" font-weight="bold" fill="#ffffff">frontend/ — platform-native UIs, one view per presenter domain</text>

    <rect x="24" y="42" width="224" height="92" rx="10"
          fill="#8fb4ea" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="136" y="61" font-size="12.5" font-weight="bold" fill="#000000">macOS — SwiftUI</text>
    <rect x="34" y="70" width="204" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="136" y="85" font-size="10" font-weight="bold" fill="#000000">Views &#183; EwCalcStore</text>
    <rect x="34" y="98" width="204" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="136" y="113" font-size="10" font-weight="bold" fill="#000000">ObservableObject adapters</text>

    <rect x="258" y="42" width="224" height="92" rx="10"
          fill="#8fb4ea" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="370" y="61" font-size="12.5" font-weight="bold" fill="#000000">Windows — WinUI 3 / C#</text>
    <rect x="268" y="70" width="204" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="370" y="85" font-size="10" font-weight="bold" fill="#000000">XAML pages &#183; x:Bind converters</text>
    <rect x="268" y="98" width="204" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="370" y="113" font-size="10" font-weight="bold" fill="#000000">ewpresenter.net — C++/CLI adapters</text>

    <rect x="492" y="42" width="224" height="92" rx="10"
          fill="#8fb4ea" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="604" y="61" font-size="12.5" font-weight="bold" fill="#000000">Linux — Qt6 / C++</text>
    <rect x="502" y="70" width="204" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="604" y="85" font-size="10" font-weight="bold" fill="#000000">MainWindow &#183; sidebar navigation</text>
    <rect x="502" y="98" width="204" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="604" y="113" font-size="10" font-weight="bold" fill="#000000">one page per presenter</text>

    <!-- bridge: macOS only -->
    <rect x="12" y="154" width="240" height="52" rx="14"
          fill="#2e6fca" stroke="#1a1a1a" stroke-width="3"/>
    <text x="132" y="176" font-size="15" font-weight="bold" fill="#ffffff">bridge/ — plain-C API</text>
    <text x="132" y="194" font-size="11" fill="#ffffff">opaque handles &#183; C callbacks</text>

    <!-- direct link: Windows and Linux -->
    <rect x="262" y="154" width="466" height="52" rx="14"
          fill="#eef2f7" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="495" y="176" font-size="12.5" font-weight="bold" fill="#1a1a1a">Windows and Linux link ewpresenter directly</text>
    <text x="495" y="194" font-size="11" fill="#333333">no C layer: Swift cannot import C++, C++/CLI and Qt can</text>

    <!-- ewpresenter -->
    <rect x="12" y="214" width="716" height="92" rx="14"
          fill="#5b2d8f" stroke="#1a1a1a" stroke-width="3"/>
    <text x="370" y="235" font-size="15" font-weight="bold" fill="#ffffff">ewpresenter — platform-agnostic presenters (C++20)</text>
    <rect x="24" y="244" width="692" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="370" y="259" font-size="10" font-weight="bold" fill="#000000">one presenter per domain: validate inputs &#8594; recompute() via libew &#8594; Output with formatted strings &#8594; set_on_change</text>
    <rect x="24" y="272" width="692" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="370" y="287" font-size="10" font-weight="bold" fill="#000000">presenter_base.h &#183; validation.h (FieldError) &#183; formatter.h &#183; no platform type crosses this boundary</text>

    <!-- libew -->
    <rect x="12" y="314" width="716" height="92" rx="14"
          fill="#0b6e75" stroke="#1a1a1a" stroke-width="3"/>
    <text x="370" y="335" font-size="15" font-weight="bold" fill="#ffffff">libew — pure calculation library, no UI</text>
    <rect x="24" y="344" width="692" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="370" y="359" font-size="10" font-weight="bold" fill="#000000">core/ — units.h strong types (Dbm, Db, Km, Mhz) with literals &#183; constants.h</text>
    <rect x="24" y="372" width="692" height="22" rx="6" fill="#f9f8ff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="370" y="387" font-size="10" font-weight="bold" fill="#000000">propagation &#183; antenna &#183; link &#183; receiver &#183; jamming &#183; location &#183; radar &#183; digital</text>

    <!-- Foundation -->
    <rect x="12" y="414" width="716" height="52" rx="14"
          fill="#00784f" stroke="#1a1a1a" stroke-width="3"/>
    <text x="370" y="436" font-size="15" font-weight="bold" fill="#ffffff">C++20 standard library only — the core has no external dependencies</text>
    <text x="370" y="454" font-size="11" fill="#ffffff">libew and ewpresenter build as static libs (build/lib/) &#183; zero-dependency test framework in libew/tests/</text>

  </g>
</svg>
